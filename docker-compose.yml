# PostgreSQL 16 con las 6 bases precargadas (Miembro 3/4/5 pueden apuntar aqui directamente).
#   docker compose up -d      -> localhost:5432, usuario/clave: postgres/postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: [ "5432:5432" ]
    volumes:
      - .:/benchmark:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
